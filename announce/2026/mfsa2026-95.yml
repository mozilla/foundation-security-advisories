## mfsa2026-95.yml
announced: September 15, 2026
impact: high
fixed_in:
- Thunderbird 140.16
title: Security Vulnerabilities fixed in Thunderbird 140.16
description: |
  *In general, these flaws cannot be exploited through email in the Thunderbird product because scripting is disabled when reading mail, but are potentially risks in browser or browser-like contexts.*

  **Note**: We have changed how we publish advisories. We no longer roll all internally identified memory safety vulnerabilities into a single CVE and are now issuing an advisory for every individual bug.
advisories:
  CVE-2026-92238:
    title: Ambiguous parsing of mail headers
    impact: medium
    reporter: Ramesh Adhikari, Dr. Faruk Kazi (CoE-CNDS Lab, VJTI, Mumbai, India)
    description: |
      A maliciously constructed mail header could lead to multiple fields being
      parsed as one, or potential memory safety violations.
    bugs:
      - url: 2060601
  CVE-2026-92239:
    title: Buffer overrun in IMAP
    impact: medium
    reporter: Ramesh Adhikari, Dr. Faruk Kazi (CoE-CNDS Lab, VJTI, Mumbai, India)
    description: |
      A maliciously constructed IMAP line could cause an out-of-bounds buffer read.
    bugs:
      - url: 2060488
  CVE-2026-92240:
    title: Out-of-bounds read in IMAP response parser
    impact: low
    reporter: Ahmed Albalawi
    description: |
      A malicious or compromised IMAP server can trigger an out-of-bounds read in
      the IMAP response parser by sending an untagged '* ID' response, crashing
      Thunderbird. The affected parsing path is reachable before authentication.
    bugs:
      - url: 2069113
