## mfsa2026-122.yml
announced: October 27, 2026
impact: high
fixed_in:
- Thunderbird 153.6
title: Security Vulnerabilities fixed in Thunderbird 153.6
description: |
  *Many of these flaws cannot be exploited through email in the Thunderbird product because scripting is disabled when reading mail, however they may pose risks in browser or browser-like contexts.*

  **Note**: We have changed how we publish advisories. We no longer roll all internally identified memory safety vulnerabilities into a single CVE and are now issuing an advisory for every individual bug.
advisories:
  CVE-2026-118174:
    title: Displaying a message could load an attacker-chosen URL through an OpenPGP key attachment
    impact: high
    reporter: Magnus Melin
    description: |
      When a message containing an OpenPGP key attachment was displayed, Thunderbird automatically loaded the attachment's content to offer importing the key. A sender could mark the attachment as an external attachment pointing to an arbitrary URL, which Thunderbird then loaded without any user interaction, bypassing remote content blocking. On Windows, a URL pointing to an attacker-controlled network share could leak the user's NTLM credentials.

      The NTLM credential leak only affects Thunderbird on Windows. On other operating systems, the issue allowed a remote request that bypassed remote content blocking.
    bugs:
      - url: 2080910
  CVE-2026-118175:
    title: Content of other messages could be included when replying to a crafted message
    impact: high
    reporter: YuYoung Sung
    description: |
      When replying to, forwarding, or editing a crafted email message as new, Thunderbird could embed parts of a different message stored in the same folder into the message being composed, without showing a blocked content warning. If the user sent the message, the content of the other message was disclosed to the recipients.
    bugs:
      - url: 2081720
  CVE-2026-118176:
    title: 'Bypass of remote UNC path restriction in mailbox: URLs'
    impact: high
    reporter: YuYoung Sung
    description: |
      Thunderbird's check that prevents mailbox: URLs from accessing files on remote Windows network shares could be bypassed using extended-length UNC paths. Displaying a specially crafted email could cause Thunderbird to connect to an SMB server chosen by the attacker, disclosing the user's Windows account name and NTLM authentication data, which could be used for offline password cracking or relay attacks.

      This bug only affects Thunderbird on Windows. Other operating systems are unaffected.
    bugs:
      - url: 2081141
  CVE-2026-118177:
    title: Calendar discovery accepted local file and remote network share locations
    impact: high
    reporter: Magnus Melin
    description: |
      When looking for calendars in a directory on a server, during account setup or when adding a new network calendar, Thunderbird accepted calendar locations pointing to other servers, local files or network shares. A malicious server, or a network attacker when the lookup used plain HTTP, could make Thunderbird subscribe to such a location. On Windows this could leak the user's NTLM credentials to an attacker-controlled host on every calendar refresh, and changes to the calendar could be written to the attacker's share or overwrite a local file.
    bugs:
      - url: 2080924
  CVE-2026-118178:
    title: RSS feed could redirect its subscription to a local file or network share
    impact: high
    reporter: KhalidAlharthi
    description: |
      A remote RSS feed could use the itunes:new-feed-url or newLocation element to permanently change its stored subscription URL to a file: URL. Thunderbird then read that location on every feed update. This allowed a malicious feed, or an attacker able to modify a feed delivered over HTTP, to make Thunderbird read local files and, on Windows, connect to an attacker-controlled network share, which could leak the user's NTLM credentials.

      The NTLM credential leak only affects Thunderbird on Windows. Other operating systems are affected by the local file read only.
    bugs:
      - url: 2075772
  CVE-2026-118179:
    title: 'Request forgery via news: links'
    impact: moderate
    reporter: Nguyen Tuan Hung
    description: |
      Clicking a news: or snews: link that referenced a message-ID made Thunderbird connect, without asking, to the host and port given in the link, even if it was not a configured news server. Line breaks in the message-ID were sent to the server unmodified, so a crafted link could send arbitrary commands to services reachable from the user's network. In addition, snews: links to such servers connected without TLS.
    bugs:
      - url: 2077789
  CVE-2026-118180:
    title: Matrix homeserver could redirect the chat session to a local file or network share
    impact: moderate
    reporter: Magnus Melin
    description: |
      When logging in to a Matrix account, Thunderbird used the homeserver address provided in the server's login response without validating it. A malicious or compromised homeserver could provide a file: URL, causing Thunderbird to send all further Matrix requests of that session to local files or, on Windows, to an attacker-controlled network share, which could leak the user's NTLM credentials.

      The NTLM credential leak only affects Thunderbird on Windows. Other operating systems are unaffected.
    bugs:
      - url: 2080939
  CVE-2026-110247:
    title: Integer overflow in libmime buffer growth could lead to heap corruption
    impact: moderate
    reporter: Ahmed Albalawi <ahmedalbalawij@gmail.com>
    description: |
      Several buffer-growth sites in libmime performed size arithmetic in 32-bit types without overflow checks. On a sufficiently large message the growth guard could fail open, or the buffer could be reallocated smaller than required, and a subsequent memcpy would then write attacker-controlled data across adjacent heap allocations.
    bugs:
      - url: 2071621
  CVE-2026-113869:
    title: Use-after-free in S/MIME decryption during a security device password prompt
    impact: moderate
    reporter: Stefan Tatschner
    description: |
      When Thunderbird asked for a security device password (for example a smartcard PIN or the Primary Password) while decrypting an S/MIME message, the message load could finish or be cancelled while the prompt was open. This freed the message decoder while it was still in use, causing a use-after-free and a potentially exploitable crash.
    bugs:
      - url: 2075530
