## mfsa2026-88.yml
announced: September 01, 2026
impact: high
fixed_in:
- Thunderbird 153.2
title: Security Vulnerabilities fixed in Thunderbird 153.2
description: |
  *In general, these flaws cannot be exploited through email in the Thunderbird product because scripting is disabled when reading mail, but are potentially risks in browser or browser-like contexts.*
advisories:
  CVE-2026-84639:
    title: Uninitialized memory in MIME parsing
    impact: high
    reporter: Ramesh Adhikari, Dr. Faruk Kazi (CoE-CNDS Lab, VJTI, Mumbai, India)
    description: |
      Triggering an error condition in certain MIME bodies would cause uninitialized
      memory to be used.
    bugs:
      - url: 2061087
  CVE-2026-84640:
    title: One byte overflow read in mail parser
    impact: medium
    reporter: Ramesh Adhikari, Dr. Faruk Kazi (CoE-CNDS Lab, VJTI, Mumbai, India)
    description: |
      A maliciously constructed mail header could lead to a one byte read past the end
      of a buffer.
    bugs:
      - url: 2063964
  CVE-2026-84641:
    title: Information disclosure due to malicious IMAP server response
    impact: low
    reporter: ABDULAZIZ ALASAIQAH
    description: |
      A malicious IMAP server can trigger use-after-free and heap-memory disclosure
      by sending a crafted ID response. Heap contents can ultimately be persisted
      to prefs.js.
    bugs:
      - url: 2057805
  CVE-2026-84637:
    title: Calendar invitation attachments could launch local executables
    impact: low
    reporter: Trung Nguyen
    description: |
      Malicious calendar invitations could use file URI attachments to launch
      local or network-hosted executables on Windows, bypassing Thunderbird's
      normal executable attachment protections. With the new invitation display
      enabled, the attachment could also appear under a misleading filename.
    bugs:
      - url: 2043878
  CVE-2026-84642:
    title: Allowed UNC hostnames for attachments interpreted as a regular expression
    impact: low
    reporter: ChinhNguyen, Lowk3yz
    description: |
      The values of the mail.allowed_attachment_hostnames advanced config setting
      were used in a regular expression without escaping. For some possible valid
      hostnames, this could allow certain unintended hostnames to also match and
      serve remote attachments.
    bugs:
      - url: 2060462
