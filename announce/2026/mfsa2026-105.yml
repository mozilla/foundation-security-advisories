## mfsa2026-105.yml
announced: October 5, 2026
impact: high
fixed_in:
- Firefox for iOS 157.1
title: Security Vulnerabilities fixed in Firefox for iOS 157.1
advisories:
  CVE-2026-103418:
    title: Universal XSS via the HTML language attribute in Translation Services
    impact: high
    reporter: Muneaki Nishimura
    description: |
      Firefox for iOS directly interpolated the page’s HTML language attribute into translation JavaScript, allowing attacker-controlled markup to execute code in Firefox’s privileged content world and bypass the page’s Content Security Policy.
    bugs:
      - url: 2062109
  CVE-2026-103417:
    title: Saved credentials can be autofilled after cross-origin navigation
    impact: moderate
    reporter: planctonone
    description: |
      Firefox for iOS could autofill saved credentials into a new page if cross-origin navigation occurred while the saved-login UI was open. Autofill was not bound to the originating page or rejected when its origin changed.
    bugs:
      - url: 2068171
