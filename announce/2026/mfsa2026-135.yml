## mfsa2026-135.yml
announced: November 24, 2026
impact: critical
fixed_in:
- Thunderbird 153.8
title: Security Vulnerabilities fixed in Thunderbird 153.8
description: |
  *Many of these flaws cannot be exploited through email in the Thunderbird product because scripting is disabled when reading mail, however they may pose risks in browser or browser-like contexts.*

  **Note**: We have changed how we publish advisories. We no longer roll all internally identified memory safety vulnerabilities into a single CVE and are now issuing an advisory for every individual bug.
advisories:
  CVE-2026-136226:
    title: Sender address spoofing in OpenPGP signed messages
    impact: critical
    reporter: Magnus Melin
    description: By adding a From header with lowercase name before the actual From header, an attacker could make Thunderbird display a different sender than the one used to verify an OpenPGP signature. Anyone whose key the victim had accepted could send messages that appeared to be validly signed by any other sender.
    bugs:
      - url: 2091708
  CVE-2026-136227:
    title: IMAP command injection and JavaScript execution when opening a crafted email
    impact: high
    reporter: Jeffrey Crowell - OpenAI Codex Security
    description: By combining several weaknesses, a crafted email could, when opened, inject commands into the authenticated IMAP connection, and load a web page with JavaScript enabled in place of the message. A bare carriage return in a header let the sender set Thunderbird's internal message flags, marking the message as a feed item and allowing its remote content to load. A reference to an embedded part placed inside an attribute value disclosed the message's internal IMAP URL to the sender. The message ID part of IMAP URLs was not validated, so loading a crafted variant of that URL sent arbitrary IMAP commands, which could modify or delete messages and folders. Finally, a frame reloading the message, together with a legacy feed marker in its content, caused the message pane to load a sender-chosen web page with scripting enabled.
    bugs:
      - url: 2089284
  CVE-2026-136228:
    title: Signature date check not applied to encrypted OpenPGP messages
    impact: moderate
    reporter: 007bsd
    description: Thunderbird did not compare the signature creation time with the message date for messages that were both signed and encrypted with OpenPGP/MIME. An attacker who had an old signed message could encrypt it to the victim and resend it with a current date, and have it shown with a valid signature, despite the protection added for CVE-2022-2226.
    bugs:
      - url: 2091521
  CVE-2026-136229:
    title: Signature date check bypassed with a missing, invalid or repeated Date header
    impact: moderate
    reporter: 007bsd
    description: When a signed OpenPGP/MIME message had no Date header, or one that could not be parsed, Thunderbird did not compare the signature creation time with the message date. For S/MIME messages with more than one Date header, a later Date header could be used for the comparison. An attacker who had an old signed message could resend it and have it shown with a valid signature, despite the protection added for CVE-2022-2226.
    bugs:
      - url: 2091516
  CVE-2026-136230:
    title: CardDAV server credentials could be sent to an HTTP proxy
    impact: moderate
    reporter: YuYoung Sung
    description: When a CardDAV address book was accessed through an HTTP proxy that requested authentication, Thunderbird could answer the proxy with the CardDAV server's username and password. This affected both setting up a new address book and syncing existing ones, where a saved password could be sent without any user interaction. A malicious or compromised proxy could use this to obtain the address book credentials, even for address books served over HTTPS.
    bugs:
      - url: 2088516
  CVE-2026-136231:
    title: Local file disclosure through dragged external attachments
    impact: moderate
    reporter: YuYoung Sung
    description: A received message could include an attachment that referred to an arbitrary local file under a misleading name. If the user dragged that attachment into a message being composed and sent it, the contents of the referenced local file were included in the outgoing message.
    bugs:
      - url: 2088475
